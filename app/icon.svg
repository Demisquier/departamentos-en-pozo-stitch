<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#0B1A34"/>
  <!-- Torre en pozo (edificio en construcción) en dorado, sobre navy -->
  <g fill="#E9B872">
    <!-- cuerpo del edificio -->
    <rect x="19" y="18" width="26" height="34" rx="2"/>
  </g>
  <!-- ventanas caladas (navy) -->
  <g fill="#0B1A34">
    <rect x="23" y="23" width="5" height="5" rx="1"/>
    <rect x="30" y="23" width="5" height="5" rx="1"/>
    <rect x="37" y="23" width="5" height="5" rx="1"/>
    <rect x="23" y="31" width="5" height="5" rx="1"/>
    <rect x="30" y="31" width="5" height="5" rx="1"/>
    <rect x="37" y="31" width="5" height="5" rx="1"/>
    <rect x="23" y="39" width="5" height="5" rx="1"/>
    <rect x="30" y="39" width="5" height="5" rx="1"/>
    <rect x="37" y="39" width="5" height="5" rx="1"/>
  </g>
  <!-- grúa de obra: brazo + gancho, remata el concepto "en pozo" -->
  <g stroke="#E9B872" stroke-width="2.4" stroke-linecap="round">
    <line x1="45" y1="12" x2="45" y2="18"/>
    <line x1="34" y1="12" x2="52" y2="12"/>
    <line x1="38" y1="12" x2="38" y2="16"/>
  </g>
</svg>
